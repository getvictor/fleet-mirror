# TEMPORARY — one-time export of the dogfood-gitops secrets into an
# age-encrypted JSON bundle for the DOGFOOD_GITOPS_SECRETS_JSON migration.
# Only the holder of the matching age private key can decrypt the artifact.
# Delete this branch, the workflow run, and the artifact after use.
name: Export dogfood gitops secrets bundle (temporary)

on:
  push:
    branches:
      - tmp-export-dogfood-secrets

permissions: {}

jobs:
  export:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Build and encrypt bundle
        env:
          # age PUBLIC key — safe to commit; only your local private key decrypts.
          AGE_RECIPIENT: "age1qeyaqg5c086marw2wx9hpp00y4slrkd6t97dka9sw3zptypjtg4qnpsy57"
          DOGFOOD_API_TOKEN: ${{ secrets.DOGFOOD_API_TOKEN }}
          DOGFOOD_MACOS_MIGRATION_WEBHOOK_URL: ${{ secrets.DOGFOOD_MACOS_MIGRATION_WEBHOOK_URL }}
          DOGFOOD_GLOBAL_ENROLL_SECRET: ${{ secrets.DOGFOOD_GLOBAL_ENROLL_SECRET }}
          DOGFOOD_SSO_METADATA: ${{ secrets.DOGFOOD_SSO_METADATA }}
          DOGFOOD_MDM_SSO_METADATA_URL: ${{ secrets.DOGFOOD_MDM_SSO_METADATA_URL }}
          DOGFOOD_FAILING_POLICIES_WEBHOOK_URL: ${{ secrets.DOGFOOD_FAILING_POLICIES_WEBHOOK_URL }}
          DOGFOOD_VULNERABILITIES_WEBHOOK_URL: ${{ secrets.DOGFOOD_VULNERABILITIES_WEBHOOK_URL }}
          DOGFOOD_WORKSTATIONS_ENROLL_SECRET: ${{ secrets.DOGFOOD_WORKSTATIONS_ENROLL_SECRET }}
          DOGFOOD_WORKSTATIONS_CANARY_ENROLL_SECRET: ${{ secrets.DOGFOOD_WORKSTATIONS_CANARY_ENROLL_SECRET }}
          DOGFOOD_SERVERS_ENROLL_SECRET: ${{ secrets.DOGFOOD_SERVERS_ENROLL_SECRET }}
          DOGFOOD_SERVERS_CANARY_ENROLL_SECRET: ${{ secrets.DOGFOOD_SERVERS_CANARY_ENROLL_SECRET }}
          DOGFOOD_EXPLORE_DATA_ENROLL_SECRET: ${{ secrets.DOGFOOD_EXPLORE_DATA_ENROLL_SECRET }}
          DOGFOOD_CALENDAR_API_KEY: ${{ secrets.DOGFOOD_CALENDAR_API_KEY }}
          DOGFOOD_COMPANY_OWNED_IPHONES_ENROLL_SECRET: ${{ secrets.DOGFOOD_COMPANY_OWNED_IPHONES_ENROLL_SECRET }}
          DOGFOOD_COMPANY_OWNED_IPADS_ENROLL_SECRET: ${{ secrets.DOGFOOD_COMPANY_OWNED_IPADS_ENROLL_SECRET }}
          DOGFOOD_COMPANY_OWNED_MOBILE_DEVICES_ENROLL_SECRET: ${{ secrets.DOGFOOD_COMPANY_OWNED_MOBILE_DEVICES_ENROLL_SECRET }}
          DOGFOOD_PERSONAL_MOBILE_DEVICES_ENROLL_SECRET: ${{ secrets.DOGFOOD_PERSONAL_MOBILE_DEVICES_ENROLL_SECRET }}
          CLOUD_MANAGEMENT_ENROLLMENT_TOKEN: ${{ secrets.CLOUD_MANAGEMENT_ENROLLMENT_TOKEN }}
          DOGFOOD_PERSONALLY_OWNED_IPHONES_ENROLL_SECRET: ${{ secrets.DOGFOOD_PERSONALLY_OWNED_IPHONES_ENROLL_SECRET }}
          DOGFOOD_ACTIVITIES_WEBHOOK_URL: ${{ secrets.DOGFOOD_ACTIVITIES_WEBHOOK_URL }}
          DOGFOOD_CALENDAR_WEBHOOK_URL: ${{ secrets.DOGFOOD_CALENDAR_WEBHOOK_URL }}
          DOGFOOD_HOST_STATUS_WEBHOOK_URL: ${{ secrets.DOGFOOD_HOST_STATUS_WEBHOOK_URL }}
          DOGFOOD_END_USER_SSO_METADATA: ${{ secrets.DOGFOOD_END_USER_SSO_METADATA }}
          DOGFOOD_TESTING_AND_QA_ENROLL_SECRET: ${{ secrets.DOGFOOD_TESTING_AND_QA_ENROLL_SECRET }}
          DOGFOOD_OKTA_CA_CERTIFICATE: ${{ secrets.DOGFOOD_OKTA_CA_CERTIFICATE }}
          DOGFOOD_OKTA_ANDROID_MANAGEMENT_HINT: ${{ secrets.DOGFOOD_OKTA_ANDROID_MANAGEMENT_HINT }}
          DOGFOOD_OKTA_IOS_MANAGEMENT_HINT: ${{ secrets.DOGFOOD_OKTA_IOS_MANAGEMENT_HINT }}
          DOGFOOD_OKTA_VERIFY_WINDOWS_URL: ${{ secrets.DOGFOOD_OKTA_VERIFY_WINDOWS_URL }}
          DOGFOOD_ENTRA_TENANT_ID: ${{ secrets.DOGFOOD_ENTRA_TENANT_ID }}
          DOGFOOD_OKTA_METADATA_URL_ADMINS: ${{ secrets.DOGFOOD_OKTA_METADATA_URL_ADMINS }}
          DOGFOOD_OKTA_METADATA_URL_END_USERS: ${{ secrets.DOGFOOD_OKTA_METADATA_URL_END_USERS }}
          DOGFOOD_ENTRA_CLIENT_ID: ${{ secrets.DOGFOOD_ENTRA_CLIENT_ID }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          # Build JSON from env and encrypt in one pipe: plaintext never
          # touches disk or the logs. jq reads values from the environment
          # by name so nothing is interpolated into the command line.
          jq -n 'env | {
            DOGFOOD_API_TOKEN,
            DOGFOOD_MACOS_MIGRATION_WEBHOOK_URL,
            DOGFOOD_GLOBAL_ENROLL_SECRET,
            DOGFOOD_SSO_METADATA,
            DOGFOOD_MDM_SSO_METADATA_URL,
            DOGFOOD_FAILING_POLICIES_WEBHOOK_URL,
            DOGFOOD_VULNERABILITIES_WEBHOOK_URL,
            DOGFOOD_WORKSTATIONS_ENROLL_SECRET,
            DOGFOOD_WORKSTATIONS_CANARY_ENROLL_SECRET,
            DOGFOOD_SERVERS_ENROLL_SECRET,
            DOGFOOD_SERVERS_CANARY_ENROLL_SECRET,
            DOGFOOD_EXPLORE_DATA_ENROLL_SECRET,
            DOGFOOD_CALENDAR_API_KEY,
            DOGFOOD_COMPANY_OWNED_IPHONES_ENROLL_SECRET,
            DOGFOOD_COMPANY_OWNED_IPADS_ENROLL_SECRET,
            DOGFOOD_COMPANY_OWNED_MOBILE_DEVICES_ENROLL_SECRET,
            DOGFOOD_PERSONAL_MOBILE_DEVICES_ENROLL_SECRET,
            CLOUD_MANAGEMENT_ENROLLMENT_TOKEN,
            DOGFOOD_PERSONALLY_OWNED_IPHONES_ENROLL_SECRET,
            DOGFOOD_ACTIVITIES_WEBHOOK_URL,
            DOGFOOD_CALENDAR_WEBHOOK_URL,
            DOGFOOD_HOST_STATUS_WEBHOOK_URL,
            DOGFOOD_END_USER_SSO_METADATA,
            DOGFOOD_TESTING_AND_QA_ENROLL_SECRET,
            DOGFOOD_OKTA_CA_CERTIFICATE,
            DOGFOOD_OKTA_ANDROID_MANAGEMENT_HINT,
            DOGFOOD_OKTA_IOS_MANAGEMENT_HINT,
            DOGFOOD_OKTA_VERIFY_WINDOWS_URL,
            DOGFOOD_ENTRA_TENANT_ID,
            DOGFOOD_OKTA_METADATA_URL_ADMINS,
            DOGFOOD_OKTA_METADATA_URL_END_USERS,
            DOGFOOD_ENTRA_CLIENT_ID
          }' | age -r "$AGE_RECIPIENT" -o bundle.json.age
          echo "Encrypted bundle written: $(wc -c < bundle.json.age) bytes"

      - name: Upload encrypted bundle
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: dogfood-secrets-bundle
          path: bundle.json.age
          retention-days: 1
